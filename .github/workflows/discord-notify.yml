name: Discord Commit Notifications

on: [push]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit info to Discord
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_HASH: ${{ github.event.head_commit.id }}
        run: |
          TITLE=$(echo "$COMMIT_MSG" | head -1 | sed 's/"/\\"/g')
          BODY=$(echo "$COMMIT_MSG" | tail -n +2 | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          AUTHOR=$(echo "$COMMIT_AUTHOR" | sed 's/"/\\"/g')
          HASH=$(echo "$COMMIT_HASH" | cut -c1-7)
          
          if [ -z "$BODY" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d "{
                \"content\": \"## $TITLE\n\n$AUTHOR | \`$HASH\`\"
              }" \
              ${{ secrets.DISCORD_WEBHOOK }}
          else
            curl -X POST -H "Content-Type: application/json" \
              -d "{
                \"content\": \"## $TITLE\n\n$BODY\n\n$AUTHOR | \`$HASH\`\"
              }" \
              ${{ secrets.DISCORD_WEBHOOK }}
          fi